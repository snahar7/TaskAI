<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Taflo</title>
    <!-- Force deployment update for password protection -->
    <style>
      .stealth-login {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .stealth-card {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .stealth-title {
        font-size: 2rem;
        font-weight: 700;
        color: #1f2937;
        margin: 0 0 0.5rem 0;
      }
      .stealth-subtitle {
        color: #6b7280;
        margin: 0 0 2rem 0;
        font-size: 0.95rem;
      }
      .stealth-input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 16px;
        margin-bottom: 1rem;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }
      .stealth-input:focus {
        outline: none;
        border-color: #667eea;
      }
      .stealth-button {
        width: 100%;
        padding: 12px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .stealth-button:hover {
        background: #5a67d8;
      }
      .stealth-error {
        color: #ef4444;
        font-size: 0.875rem;
        margin-top: 0.5rem;
      }
      .hidden { display: none !important; }
    </style>
  </head>
  <body>
    <div id="stealth-protection" class="stealth-login">
      <div class="stealth-card">
        <h1 class="stealth-title">Taflo</h1>
        <p class="stealth-subtitle">Enter access code to continue</p>
        <input type="password" id="stealth-password" class="stealth-input" placeholder="Access code" autocomplete="off">
        <button onclick="checkStealthPassword()" class="stealth-button">Access App</button>
        <div id="stealth-error" class="stealth-error hidden">Invalid access code. Please try again.</div>
      </div>
    </div>
    <div id="root" class="hidden"></div>
    
    <script>
      function checkStealthPassword() {
        const password = document.getElementById('stealth-password').value;
        const error = document.getElementById('stealth-error');
        
        if (password === 'taflo2025') {
          localStorage.setItem('taflo_stealth_auth', 'authenticated');
          document.getElementById('stealth-protection').classList.add('hidden');
          document.getElementById('root').classList.remove('hidden');
          loadMainApp();
        } else {
          error.classList.remove('hidden');
          document.getElementById('stealth-password').value = '';
        }
      }
      
      function checkExistingAuth() {
        const auth = localStorage.getItem('taflo_stealth_auth');
        if (auth === 'authenticated') {
          document.getElementById('stealth-protection').classList.add('hidden');
          document.getElementById('root').classList.remove('hidden');
          loadMainApp();
        }
      }
      
      function loadMainApp() {
        // Load the main React app
        const script = document.createElement('script');
        script.type = 'module';
        script.src = '/src/main.tsx';
        document.head.appendChild(script);
      }
      
      // Allow Enter key to submit
      document.getElementById('stealth-password').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          checkStealthPassword();
        }
      });
      
      // Check auth on page load
      checkExistingAuth();
      
      // Version: v2.0 - Direct HTML protection
    </script>
    
    <!-- This is a replit script which adds a banner on the top of the page when opened in development mode outside the replit environment -->
    <script type="text/javascript" src="https://replit.com/public/js/replit-dev-banner.js"></script>
  </body>
</html>
